<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prototipo de la app de partes de campo de Vientos del Sur: planificación, parte diario, revisión VDS y certificación del cliente.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>VDS Partes de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Figma-style dotted canvas + prototype toolbar; a 12.9" landscape tablet frame scaled to fit; app = dark rail + work area */
:root{
  --canvas:#E3E7EC; --canvas-dot:#CBD2DA; --chrome:#FFFFFF; --chrome-line:#D3D9E0;
  --surface:#F2F4F7; --panel:#FFFFFF; --panel-2:#F7F9FB;
  --ink:#14202A; --muted:#5C6976; --faint:#8994A0; --line:#DCE1E7; --line-2:#C7CFD8;
  --accent:#C21F35; --accent-ink:#FFFFFF; --on:#FFFFFF;
  --rail:#13212C; --rail-ink:#E9EEF3; --rail-muted:#8D9DAC; --rail-hi:#1E3242;
  --bezel:#0D1216;
  --st-plan:#4A689A; --st-curso:#B0740A; --st-env:#5852C6; --st-obs:#C64F1F; --st-apr:#0E7C8B; --st-ok:#1D8256; --st-err:#C0263A;
  --pr-alta:#D06A12;
  --t-op:#2C8655; --t-tr:#3A78C0; --t-es:#C99016; --t-vi:#7F60C4; --t-sb:#8A95A1;
  --hot:#2F80ED;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0E1318; --canvas-dot:#1D2630; --chrome:#161D24; --chrome-line:#27323C;
  --surface:#10171E; --panel:#18212A; --panel-2:#1C2630;
  --ink:#E5EBF0; --muted:#9BA8B5; --faint:#6F7D8A; --line:#26323D; --line-2:#344350;
  --accent:#E3394F; --rail:#0A1016; --rail-muted:#7F8FA0; --rail-hi:#172634;
  --st-plan:#7E9DD2; --st-curso:#E2A63C; --st-env:#9590F2; --st-obs:#EF7B4B; --st-apr:#33B3C4; --st-ok:#3DB981; --st-err:#F2586C;
  --pr-alta:#F08A3A;
  --t-op:#3A9E68; --t-tr:#4C8AD2; --t-es:#D9A02A; --t-vi:#9177D6; --t-sb:#76828F; --hot:#4C9AFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0E1318; --canvas-dot:#1D2630; --chrome:#161D24; --chrome-line:#27323C;
  --surface:#10171E; --panel:#18212A; --panel-2:#1C2630;
  --ink:#E5EBF0; --muted:#9BA8B5; --faint:#6F7D8A; --line:#26323D; --line-2:#344350;
  --accent:#E3394F; --rail:#0A1016; --rail-muted:#7F8FA0; --rail-hi:#172634;
  --st-plan:#7E9DD2; --st-curso:#E2A63C; --st-env:#9590F2; --st-obs:#EF7B4B; --st-apr:#33B3C4; --st-ok:#3DB981; --st-err:#F2586C;
  --pr-alta:#F08A3A;
  --t-op:#3A9E68; --t-tr:#4C8AD2; --t-es:#D9A02A; --t-vi:#9177D6; --t-sb:#76828F; --hot:#4C9AFF;
  color-scheme:dark}

html,body{height:100%}
body{background-color:var(--canvas);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:0}
.sm{font-size:12.5px;color:var(--muted)}

/* ---------- prototype chrome ---------- */
.proto{padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin-inline:auto}
.chrome{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:10px;padding:8px 10px;box-shadow:0 1px 2px rgba(10,20,30,.05)}
.file{display:flex;align-items:center;gap:10px;min-width:0}
.file b{font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.02em;display:block;line-height:1.1}
.file small{color:var(--muted);font-size:12px}
.jump{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jump .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.jseg{display:flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--chrome-line);border-radius:8px;padding:2px}
.jseg button{border:0;background:none;height:30px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.jseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,30,.14)}
.chrome .sp{flex:1}
.cbtn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--chrome-line);background:var(--panel);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cbtn[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
.cbtn.warn{border-color:var(--st-err);color:var(--st-err)}
.stage{position:relative;width:100%}
.device{position:absolute;top:0;left:50%;width:1366px;height:1024px;transform-origin:top center;transform:translateX(-50%) scale(var(--s,1));background:var(--bezel);border-radius:44px;box-shadow:0 40px 90px -30px rgba(8,16,24,.55),inset 0 0 0 1px rgba(255,255,255,.05)}
.device::before{content:"";position:absolute;top:50%;left:7px;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#1d262e}
.screen{position:absolute;inset:16px;border-radius:26px;overflow:hidden;background:var(--surface);display:flex}
.flowcap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;color:var(--muted);font-size:13px;margin:0}
.flowcap b{color:var(--ink);font-weight:600}
.screen.hs-on [data-a],.screen.hs [data-a],.screen.hs-on .gbar,.screen.hs .gbar,.screen.hs-on input,.screen.hs input,.screen.hs-on select,.screen.hs select,.screen.hs-on textarea,.screen.hs textarea,.screen.hs-on canvas,.screen.hs canvas,.screen.hs-on .upl,.screen.hs .upl{outline:2px solid var(--hot)!important;outline-offset:1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 22%,transparent)!important}

/* ---------- app shell ---------- */
.rail{width:212px;flex:none;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:18px 12px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:.05em;line-height:1;display:block}
.brand small{display:block;color:var(--rail-muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rrole{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:8px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:8px;border:0;background:none;color:var(--rail-muted);font-weight:600;font-size:14.5px;text-align:left;cursor:pointer}
.nav:hover{color:var(--rail-ink)}
.nav[aria-current="page"]{background:var(--rail-hi);color:var(--rail-ink);box-shadow:inset 3px 0 0 var(--accent)}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.who{margin-top:auto;border-top:1px solid var(--rail-hi);padding:14px 4px 0;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--rail-hi);color:var(--rail-ink);flex:none}
.wn{min-width:0;flex:1}
.wn b{display:block;font-size:14px}
.wn small{display:block;color:var(--rail-muted);font-size:11.5px;line-height:1.25}
.rl{color:var(--rail-muted)!important}
.rl:hover{background:var(--rail-hi)!important;color:var(--rail-ink)!important}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:66px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-family:var(--f-disp);font-weight:600;font-size:26px;margin:0;letter-spacing:.01em;line-height:1}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .sp{flex:1}
.datechip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:13px;cursor:pointer;color:var(--st-ok)}
.sync.off{color:var(--st-obs);border-color:color-mix(in srgb,var(--st-obs) 50%,var(--line-2))}
.view{flex:1;overflow:auto;padding:20px 24px}
.view.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.okb{background:var(--st-ok);border-color:var(--st-ok);color:var(--on)}
.btn.aprb{background:var(--st-apr);border-color:var(--st-apr);color:var(--on)}
.btn.obsb{color:var(--st-obs);border-color:color-mix(in srgb,var(--st-obs) 55%,var(--line-2))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface)}
.btn.sm2{height:34px;padding:0 12px;font-size:13.5px}
.btn.lg{height:52px;font-size:16px;padding:0 22px;border-radius:10px}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.ibtn{width:38px;height:38px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn.del:hover{color:var(--st-err)}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.s-plan{--c:var(--st-plan)} .s-curso{--c:var(--st-curso)} .s-env{--c:var(--st-env)} .s-obs{--c:var(--st-obs)} .s-apr{--c:var(--st-apr)} .s-cert{--c:var(--st-ok)}
.prio{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.p-urg{--c:var(--st-err)} .p-alta{--c:var(--pr-alta)} .p-media{--c:var(--st-plan)} .p-baja{--c:var(--faint)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.hab{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.hab .i{width:13px;height:13px;stroke-width:2.4}
.h-ok{--c:var(--st-ok)} .h-pronto{--c:var(--st-curso)} .h-venc,.h-sin{--c:var(--st-err)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.lab{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.inp{height:42px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 12px;font-weight:500;font-size:15px;width:100%;min-width:0}
.inp:focus{border-color:var(--hot);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 20%,transparent)}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp.bad{border-color:var(--st-err)}
.inp:disabled{opacity:.45}
.ferr{color:var(--st-err);font-size:12.5px;font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border:0;border-radius:7px;background:none;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,30,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-color:var(--accent);color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.pnl h3{margin:0 0 12px;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.pnl h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .inp{height:40px}
.tbl tr.off td{opacity:.5}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.warn{color:var(--st-curso)!important;font-weight:600}
.errc{color:var(--st-err)!important;font-weight:600}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:var(--line-2);position:relative;cursor:pointer;flex:none}
.sw span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--st-ok)}
.sw[aria-checked="true"] span{left:21px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.stepper button{width:42px;height:40px;border:0;background:var(--panel);font-size:20px;font-weight:600;cursor:pointer;color:var(--ink)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper b{min-width:86px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;border-inline:1px solid var(--line)}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1.1fr 1fr;width:100%}
.lbrand{background:var(--rail);color:var(--rail-ink);padding:52px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lbrand .wind{position:absolute;inset:0;width:100%;height:100%}
.lbrand>*:not(.wind){position:relative}
.lbrand h2{font-family:var(--f-disp);font-size:68px;line-height:.92;font-weight:600;margin:auto 0 18px;text-wrap:balance;letter-spacing:-.005em}
.lbrand h2 em{font-style:normal;color:var(--accent)}
.lbrand p{color:var(--rail-muted);max-width:42ch;margin:0 0 30px;font-size:16px}
.lsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0;padding:0;list-style:none}
.lsteps li{border-top:2px solid var(--rail-hi);padding-top:10px;font-size:13px;color:var(--rail-muted)}
.lsteps li b{display:block;color:var(--rail-ink);font-size:15px;font-weight:600}
.lsteps li span{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.lloc{margin-top:30px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.lform{padding:52px 64px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--panel)}
.lform h3{font-family:var(--f-disp);font-size:32px;font-weight:600;margin:0}
.lform form{display:flex;flex-direction:column;gap:12px}
.demo{display:grid;gap:8px;margin-top:6px}
.demo button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);text-align:left;cursor:pointer}
.demo button:hover{border-color:var(--accent)}
.demo .av{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.demo .dn{flex:1;min-width:0}
.demo .dn b{display:block;font-size:14.5px}
.demo .dn small{color:var(--muted);font-size:12.5px}
.demo .rolet{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.divl{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.divl::before,.divl::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- planner ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.kpi b{font-family:var(--f-disp);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.kpi span{color:var(--muted);font-size:13px;line-height:1.2}
.ptool{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ptool .seg{flex:none}
.ptool .sp{flex:1}
.pnav{display:flex;align-items:center;gap:4px}
.pnav b{min-width:210px;text-align:center;font-family:var(--f-disp);font-size:19px;font-weight:600}
.gantt{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grow{display:grid;grid-template-columns:200px minmax(0,1fr);border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.glab{padding:10px 12px;border-right:1px solid var(--line);background:var(--panel-2);min-width:0}
.glab b{font-size:14px;display:block}
.glab small{color:var(--muted);font-size:12px;display:block;line-height:1.25}
.occ{--c:var(--st-plan);display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.occ i{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;display:block}
.occ i em{position:absolute;top:0;bottom:0;left:0;background:var(--c);border-radius:3px}
.occ b{font-size:13px;color:var(--c);display:inline;min-width:36px;text-align:right}
.ghead{display:flex}
.ghead span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 5px;border-left:1px solid var(--line);line-height:1.15;font-variant-numeric:tabular-nums}
.ghead span b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.ghead span.we{background:var(--panel-2)}
.ghead span.td{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.ghead span.td b{color:var(--accent)}
.gmonth{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px;border-right:1px solid var(--line);background:var(--panel-2);display:flex;align-items:flex-end}
.gtrack{position:relative;overflow:hidden;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 28) 100%}
.gwe{position:absolute;top:0;bottom:0;background:var(--panel-2)}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.7;z-index:3;pointer-events:none}
.gbar{--c:var(--st-plan);position:absolute;height:40px;border-radius:7px;background:color-mix(in srgb,var(--c) 15%,var(--panel));border:1.5px solid var(--c);display:flex;align-items:center;gap:6px;padding:0 12px 5px;font-size:12px;font-weight:600;color:var(--ink);cursor:grab;overflow:hidden;white-space:nowrap;touch-action:none;user-select:none;z-index:2}
.gbar .gl{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gbar .gl .mono{color:var(--c);font-weight:600}
.gbar .gd{position:absolute;left:0;right:0;bottom:0;height:5px;display:flex;pointer-events:none}
.gbar .gd i{flex:1;background:var(--c);border-right:1px solid var(--panel)}
.gbar .gd i.s-plan{background:transparent}
.gh{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;z-index:2}
.gh.l{left:0}.gh.r{right:0}
.gh::after{content:"";position:absolute;top:50%;margin-top:-9px;height:14px;width:3px;border-radius:2px;background:var(--c);left:4.5px;opacity:.75}
.gbar.lock .gh.l{display:none}
.gbar.clash{outline:2px dashed var(--st-err);outline-offset:1px}
.gbar.drag{cursor:grabbing;box-shadow:0 8px 20px -6px rgba(0,0,0,.35);z-index:6}
.gpr{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none;pointer-events:none}
.gocc{display:flex;align-items:flex-end;height:46px;padding:6px 0 4px}
.gocc span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gocc span i{width:62%;border-radius:2px 2px 0 0;background:var(--c,var(--st-plan));min-height:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.legend .sp{flex:1}
.board{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bh{padding:8px 8px 9px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.bh:first-child{border-left:0}
.bh b{display:block;font-family:var(--f-disp);font-size:22px;color:var(--ink);letter-spacing:0;line-height:1.05}
.bh .oc{display:block;text-transform:none;letter-spacing:0;font-weight:600;margin-top:2px}
.bh.today{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.bh.today b{color:var(--accent)}
.rh{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.rh b{font-size:14px;display:block}
.rh small{color:var(--muted);font-size:12px;display:block;line-height:1.25}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;min-height:104px;display:flex;flex-direction:column;gap:5px}
.cell.today{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.board>.lastrow{border-bottom:0}
.add{flex:1;min-height:24px;border:1px dashed transparent;border-radius:7px;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1}
.add:hover,.add:focus-visible{border-color:var(--line-2);color:var(--accent)}
.job{--c:var(--st-plan);display:block;width:100%;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--c);border-radius:7px;padding:5px 7px;font-size:12px;line-height:1.3}
.job:hover{border-color:var(--c)}
.job .l1{display:flex;justify-content:space-between;gap:4px;font-weight:700;align-items:center}
.job .l1 .mono{color:var(--c)}
.job .l2{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mhead span{padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:var(--panel-2)}
.mday{min-height:122px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mday:nth-child(7n){border-right:0}
.mday.out{background:var(--panel-2)}
.mday.out .dn{color:var(--faint)}
.mday .mt{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dn{font-family:var(--f-disp);font-size:19px;font-weight:600;line-height:1}
.mday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.mday.today .dn{color:var(--accent)}
.opct{--c:var(--st-plan);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);font-variant-numeric:tabular-nums}
.mchip{--c:var(--st-plan);display:block;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--panel));border-radius:4px;padding:2px 6px;font-size:11.5px;font-weight:600;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;color:var(--ink)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.drawer{position:absolute;top:66px;right:0;bottom:0;width:420px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-16px 0 40px -18px rgba(8,16,24,.35);display:flex;flex-direction:column;z-index:20}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-family:var(--f-disp);font-size:24px;font-weight:600;margin:4px 0 0;line-height:1.05}
.db{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dlist button,.dlist div{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--panel);text-align:left;font-size:13.5px}
.dlist>*:last-child{border-bottom:0}
.dlist button{cursor:pointer}
.dlist button:hover{background:var(--panel-2)}
.dlist .dd{width:92px;font-weight:600}
.dlist .sp{flex:1}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 12px 20px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.tl li::after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li:last-child::before{background:var(--accent)}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl q{display:block;color:var(--muted);font-style:italic;margin-top:2px;quotes:none}
.habtbl td{white-space:nowrap}

/* ---------- modal / toast ---------- */
.scrim{position:absolute;inset:0;background:rgba(8,14,20,.5);display:grid;place-items:center;z-index:30}
.modal{width:860px;max-height:92%;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h2{font-family:var(--f-disp);font-size:25px;font-weight:600;margin:0;flex:1}
.mb{padding:18px 22px;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:10px}
.mf .note{margin-right:auto}
.note{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.note.w{color:var(--st-curso);font-weight:600}
.note.e{color:var(--st-err);font-weight:600}
.ctbox{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.ctbox span{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.habbox{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.habbox .hh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.habbox .hh .sp{flex:1}
.habgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.habgrid div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.habgrid div:nth-child(odd){border-right:1px solid var(--line)}
.done{padding:40px 40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--st-ok) 15%,transparent);color:var(--st-ok)}
.done .big .i{width:38px;height:38px;stroke-width:2.2}
.done h2{font-family:var(--f-disp);font-size:30px;font-weight:600;margin:6px 0 0}
.done p{color:var(--muted);margin:0 0 14px;max-width:44ch}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14.5px;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);white-space:nowrap;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,10px);opacity:.3}}
.docp{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.dband{background:var(--accent);color:var(--accent-ink);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.dband b{font-family:var(--f-disp);font-size:22px;letter-spacing:.06em;display:block;line-height:1}
.dband small{font-size:12px;opacity:.9}
.dband .r{text-align:right}
.dsec{padding:12px 20px 4px}
.dsec h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.dsec .tbl{font-size:13px}
.dsec .tbl td,.dsec .tbl th{padding:5px 6px}
.dkv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;font-size:13px;padding-bottom:6px}
.dkv span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dsign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:14px}
.dsign div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.dsign .sv{height:46px;display:flex;align-items:center}
.dsign .sv img,.dsign .sv svg{max-height:44px;max-width:100%}

/* ---------- operador ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.hello h2{font-family:var(--f-disp);font-size:34px;font-weight:600;margin:0;line-height:1}
.hello p{margin:4px 0 0;color:var(--muted)}
.sect{margin-bottom:22px}
.sect>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;gap:8px;align-items:center}
.cards{display:grid;gap:10px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center}
.tcard.obs{border-color:color-mix(in srgb,var(--st-obs) 50%,var(--line));box-shadow:inset 4px 0 0 var(--st-obs)}
.tcard.cur{box-shadow:inset 4px 0 0 var(--st-curso)}
.tcard .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard h4{font-family:var(--f-disp);font-size:23px;font-weight:600;margin:4px 0 0;line-height:1.1}
.tcard .meta{display:flex;gap:6px 16px;color:var(--muted);font-size:13.5px;flex-wrap:wrap;margin-top:6px}
.tcard .meta span{display:inline-flex;gap:6px;align-items:center}
.tcard .meta .i{width:16px;height:16px}
.tcard.mini{padding:12px 14px}
.tcard.mini h4{font-size:18px}
.vnote{grid-column:1/-1;background:color-mix(in srgb,var(--st-obs) 9%,transparent);border-radius:9px;padding:10px 12px;font-size:14px;display:flex;gap:10px}
.vnote .i{color:var(--st-obs)}
.vnote b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--st-obs)}
.prog{grid-column:1/-1;display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--st-ok)}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:14px;text-align:center}
.edhead{padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.edhead .meta{display:flex;gap:4px 20px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.edhead .meta b{color:var(--ink);font-weight:600}
.steps{display:flex;gap:4px;padding:8px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.stp{flex:1;display:flex;align-items:center;gap:9px;height:44px;padding:0 10px;border-radius:8px;border:0;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.stp i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;border:1.5px solid var(--line-2);font-variant-numeric:tabular-nums;flex:none}
.stp i .i{width:15px;height:15px;stroke-width:2.6}
.stp:hover{background:var(--surface)}
.stp[aria-current="step"]{background:var(--surface);color:var(--ink)}
.stp[aria-current="step"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stp.ok i{background:var(--st-ok);border-color:var(--st-ok);color:var(--on)}
.edbody{flex:1;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:16px}
.edfoot{padding:12px 24px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center}
.saved{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;margin-right:auto}
.saved .i{width:17px;height:17px;color:var(--st-ok)}
.saved.off .i{color:var(--st-obs)}
.tog{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;background:var(--panel);width:100%;text-align:left;font-weight:500;font-size:15px}
.tog .bx{width:28px;height:28px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.tog .bx .i{width:18px;height:18px;stroke-width:2.6}
.tog[aria-pressed="true"] .bx{background:var(--st-ok);border-color:var(--st-ok);color:var(--on)}
.tog[aria-pressed="true"]{border-color:color-mix(in srgb,var(--st-ok) 45%,var(--line-2))}
.tog small{display:block;color:var(--muted);font-size:12.5px}
.togs{display:grid;gap:8px}
.clima{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.csrc{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.csrc .sp{flex:1}
.tbar{position:relative;height:46px;border-radius:9px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tseg{position:absolute;top:0;bottom:0;background:var(--c);display:flex;align-items:center;justify-content:center;color:var(--on);font-size:11.5px;font-weight:600;overflow:hidden;white-space:nowrap;box-shadow:inset -1px 0 0 var(--panel)}
.tticks{position:relative;height:18px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:4px}
.tticks span{position:absolute;transform:translateX(-50%)}
.tticks span:first-child{transform:none}
.tticks span:last-child{transform:translateX(-100%)}
.tlegend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;margin-top:10px}
.tlegend span{display:inline-flex;align-items:center;gap:7px}
.tlegend i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.tlegend b{font-variant-numeric:tabular-nums}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.c-op{--c:var(--t-op)} .c-tr{--c:var(--t-tr)} .c-es{--c:var(--t-es)} .c-vi{--c:var(--t-vi)} .c-sb{--c:var(--t-sb)}
.windhint{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--t-vi) 10%,transparent);border-radius:9px;padding:10px 12px;font-size:13.5px}
.windhint .i{color:var(--t-vi)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .i{color:var(--c);width:19px;height:19px}
.chk.err{--c:var(--st-err)} .chk.warn{--c:var(--st-curso)} .chk.ok{--c:var(--st-ok)}
.chk span{flex:1;min-width:0}
.chk .go{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel-2);border-radius:9px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ph{background:repeating-linear-gradient(135deg,var(--line) 0 7px,var(--panel-2) 7px 14px)}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--panel) 85%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.thumb .x .i{width:14px;height:14px}
.upl{aspect-ratio:4/3;max-width:100%;border-radius:8px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:var(--panel-2);position:relative}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.upl input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sigwrap{position:relative}
canvas.sig{display:block;width:100%;height:140px;border:1.5px dashed var(--line-2);border-radius:10px;background:var(--panel-2);touch-action:none;cursor:crosshair}
.sigwrap .hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--faint);pointer-events:none}

function checks(p){
  const e=p.ejec,out=[];if(!e)return out;
  const k=e.check;
  if(!e.clima||e.clima.t===''||e.clima.r==='')out.push(['err','Faltan las condiciones climáticas','Inicio']);
  if(!(k.charla&&k.ptw&&k.epp))out.push(['err','Checklist de seguridad incompleto','Inicio']);
  if(!e.llegada)out.push(['err','Falta la hora de llegada a locación','Inicio']);
  const pres=e.personal.filter(x=>x.pres);
  if(!pres.length)out.push(['err','No hay personal presente','Personal']);
  pres.forEach(x=>{const h=hab(x.n,p.op,p.fecha);
    if(habBad(h))out.push(['err',`${x.n}: ${h.st==='venc'?'habilitación vencida el '+fS(h.vence):'sin habilitación'} para ${OPS[p.op]}`,'Personal']);
    if(!x.in||!x.out)out.push(['err',`${x.n}: falta hora de ${!x.in?'ingreso':'salida'}`,'Personal']);
    else if(dur(x.in,x.out)>720)out.push(['warn',`${x.n}: jornada de ${fmtH(dur(x.in,x.out))}, supera 12 h`,'Personal']);
  });
  e.equipos.forEach(q=>{const h=hab(q.c,p.op,p.fecha);
    if(habBad(h))out.push(['err',`${q.c} ${EQ[q.c]}: ${h.st==='venc'?'habilitación vencida el '+fS(h.vence):'sin habilitación'} para ${OPS[p.op]}`,'Equipos']);
    if(q.k0===''||q.k1==='')out.push(['err',`${q.c}: falta km ${q.k0===''?'inicial':'final'}`,'Equipos']);
    else if(Number(q.k1)<Number(q.k0))out.push(['err',`${q.c}: km final menor al inicial`,'Equipos']);
  });
  if(!e.tareas.length)out.push(['err','No hay tareas informadas','Tareas']);
  e.tareas.forEach(t=>{if(!(Number(t.q)>0))out.push(['err',`${t.d}: falta la cantidad`,'Tareas'])});
  p.prev.filter(d=>!e.tareas.some(t=>t.d===d)).forEach(d=>out.push(['warn',`Tarea prevista sin informar: ${d}`,'Tareas']));
  if(!e.tiempos.length)out.push(['err','No hay tiempos registrados','Tiempos']);
  if(e.clima&&Number(e.clima.r)>=60&&!e.tiempos.some(t=>t.c==='vi'))out.push(['warn',`Ráfagas de ${e.clima.r} km/h sin parada por viento registrada`,'Tiempos']);
  const esp=e.tiempos.filter(t=>t.c==='es').reduce((s,t)=>s+dur(t.de,t.a),0);
  if(esp>60)out.push([e.obs.trim()?'warn':'err',`Espera de operadora de ${fmtH(esp)}${e.obs.trim()?' (justificada en observaciones)':': justificar en observaciones'}`,e.obs.trim()?'Tiempos':'Cierre']);
  if(!p.sup||!p.rt)out.push(['err','Falta supervisor responsable o responsable técnico','Cierre']);
  if(!e.firma)out.push(['err','Falta la firma del jefe de cuadrilla','Cierre']);
  return out;
}

/* ---------- planner: planificación (Gantt · por recurso · mes) ---------- */
function periodDays(){
  if(S.pv==='gantt')return Array.from({length:28},(_,i)=>addDays(S.gs,i));
  if(S.pv==='rec')return Array.from({length:7},(_,i)=>addDays(S.ws,i));
  const[y,m]=S.ms.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${S.ms}-${String(i+1).padStart(2,'0')}`);
}
function periodLabel(){
  if(S.pv==='gantt'){const e=addDays(S.gs,27);return `${d8(S.gs).getDate()} ${MES[d8(S.gs).getMonth()]} – ${d8(e).getDate()} ${MES[d8(e).getMonth()]}`}
  if(S.pv==='rec'){const e=addDays(S.ws,6);return `Semana ${d8(S.ws).getDate()} – ${d8(e).getDate()} ${MES[d8(e).getMonth()]}`}
  const[y,m]=S.ms.split('-').map(Number);return MESL[m-1][0].toUpperCase()+MESL[m-1].slice(1)+' '+y;
}
function vPlan(){
  const days=periodDays(),oa=occAll(days),ps=S.partes;
  const k=[[oa+'%','Ocupación de recursos en el período',occC(oa)],[ps.filter(p=>p.estado==='curso').length,'Partes en curso hoy','var(--st-curso)'],
    [ps.filter(p=>p.estado==='env').length,'En revisión VDS','var(--st-env)'],[ps.filter(p=>p.estado==='apr').length,'Esperando certificación del cliente','var(--st-apr)'],[ps.filter(p=>p.estado==='obs').length,'Observados','var(--st-obs)']];
  let h=`<div class="kpis">${k.map(([n,l,c])=>`<div class="kpi" style="--c:${c}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
  h+=`<div class="ptool"><div class="seg" role="group" aria-label="Vista">${[['gantt','Gantt','gantt'],['rec','Por recurso','rows'],['mes','Mes','cal']].map(([k2,l,i])=>`<button data-a="p-view" data-v="${k2}" aria-pressed="${S.pv===k2}">${ic(i)}${l}</button>`).join('')}</div>
    <span class="sp"></span><div class="pnav"><button class="ibtn" data-a="p-nav" data-d="-1" aria-label="Período anterior">${ic('chl')}</button><b>${periodLabel()}</b><button class="ibtn" data-a="p-nav" data-d="1" aria-label="Período siguiente">${ic('chr')}</button></div><button class="btn sm2" data-a="p-nav" data-d="0">Hoy</button></div>`;
  h+=S.pv==='gantt'?vGantt():S.pv==='rec'?vWeek():vMonth();
  h+=`<div class="legend">${['plan','curso','env','obs','apr','cert'].map(e=>pill(e)).join('')}<span class="sp"></span>${S.pv==='gantt'?'<span>Arrastrá una barra para moverla o su borde derecho para estirar o acortar el trabajo</span>':'<span>Ocupación = días con trabajo planificado / días del período</span>'}</div>`;
  return h;
}
function lanes(ts){const L=[];ts.slice().sort((a,b)=>a.inicio.localeCompare(b.inicio)).forEach(t=>{let i=L.findIndex(end=>end<t.inicio);if(i<0){i=L.length;L.push('')}L[i]=tEnd(t);t._lane=i});return Math.max(1,L.length)}
function vGantt(){
  const N=28,days=periodDays(),start=S.gs,end=days[N-1];
  const pct=f=>diffD(start,f)/N*100;
  let h=`<div class="gantt"><div class="grow"><div class="gmonth">Recurso · ocupación</div><div class="ghead">${days.map(f=>{const d=d8(f),w=d.getDay();return `<span class="${w===0||w===6?'we':''}${f===TODAY?' td':''}">${'DLMMJVS'[w]}<b>${d.getDate()}</b></span>`}).join('')}</div></div>`;
  const we=days.map((f,i)=>{const w=d8(f).getDay();return w===6?`<div class="gwe" style="left:${i/N*100}%;width:${200/N}%"></div>`:w===0&&i===0?`<div class="gwe" style="left:0;width:${100/N}%"></div>`:''}).join('');
  const now=TODAY>=start&&TODAY<=end?`<div class="gnow" style="left:calc(${pct(TODAY)}% + ${100/N/2}%)"></div>`:'';
  RECURSOS.forEach(r=>{
    const ts=S.trabajos.filter(t=>t.rec===r.id&&t.inicio<=end&&tEnd(t)>=start);
    const nl=lanes(ts),o=occRec(r.id,days);
    const bars=ts.map(t=>{const st=tState(t),cl=clashes(t).length,lk=started(t);
      const ds=tDays(t).map(f=>`<i class="s-${dayState(t,f)}"></i>`).join('');
      return `<div class="gbar s-${st}${cl?' clash':''}${lk?' lock':''}" data-id="${t.id}" style="left:${pct(t.inicio)}%;width:${t.dias/N*100}%;top:${10+t._lane*46}px" title="${t.id} · ${OPS[CONTRATOS[t.ct].op]} · ${esc(t.yac)} ${esc(t.pozo)} · ${t.dias} días${cl?' · se superpone con '+clashes(t).map(x=>x.id).join(', '):''}">
        <span class="gh l" data-h="l"></span><span class="gpr" style="--pc:${PRIO_C[t.prio]}"></span><span class="gl"><span class="mono">${t.id}</span> ${CONTRATOS[t.ct].op} · ${esc(t.pozo)} · ${t.dias} d</span><span class="gd">${ds}</span><span class="gh r" data-h="r"></span></div>`}).join('');
    h+=`<div class="grow"><div class="glab"><b>${r.n}</b><small>${jefeOf(r.id)} · ${r.k}</small><div class="occ" style="--c:${occC(o)}"><i><em style="width:${o}%"></em></i><b>${o}%</b></div></div><div class="gtrack" style="height:${20+nl*46}px">${we}${now}${bars}</div></div>`;
  });
  h+=`<div class="grow"><div class="glab"><b>Ocupación diaria</b><small>Recursos ocupados / ${RECURSOS.length}</small></div><div class="gocc">${days.map(f=>{const o=occDay(f);return `<span title="${fDay(f)}: ${o}%" style="--c:${occC(o)}"><i style="height:${Math.max(o,3)*0.3}px"></i>${o}</span>`}).join('')}</div></div></div>`;
  return h;
}
function vWeek(){
  const days=periodDays();
  let h=`<div class="board" role="grid" aria-label="Calendario por recurso"><div class="bh">Recurso</div>`;
  days.forEach(f=>{const x=d8(f),o=occDay(f);h+=`<div class="bh${f===TODAY?' today':''}">${DIAS[x.getDay()]}${f===TODAY?' · hoy':''}<b>${x.getDate()}</b><span class="oc" style="color:${occC(o)}">${o}% ocupado</span></div>`});
  RECURSOS.forEach((r,ri)=>{
    const last=ri===RECURSOS.length-1?' lastrow':'',o=occRec(r.id,days);
    h+=`<div class="rh${last}"><b>${r.n}</b><small>${jefeOf(r.id)}</small><div class="occ" style="--c:${occC(o)}"><i><em style="width:${o}%"></em></i><b>${o}%</b></div></div>`;
    days.forEach(f=>{
      const ts=S.trabajos.filter(t=>t.rec===r.id&&covers(t,f));
      h+=`<div class="cell${f===TODAY?' today':''}${last}">${ts.map(t=>{const st=dayState(t,f),p=parteOf(t.id,f);
        return `<button class="job s-${st}" data-a="t-open" data-id="${t.id}"><span class="l1"><span class="mono">${t.id}</span><span class="gpr" style="--pc:${PRIO_C[t.prio]}" title="Prioridad ${PRIO[t.prio]}"></span></span><span class="l2">${CONTRATOS[t.ct].op} · ${esc(t.pozo)}</span><span class="l2">Día ${diffD(t.inicio,f)+1}/${t.dias}${p?' · '+p.id.slice(3):''}${t.turno==='N'?' · noche':''}</span></button>`}).join('')}
        ${f>=TODAY?`<button class="add" data-a="p-cell" data-rec="${r.id}" data-d="${f}" aria-label="Planificar ${r.n} el ${fDay(f)}" title="Planificar ${r.n} · ${fDay(f)}">+</button>`:''}</div>`;
    });
  });
  return h+'</div>';
}
function vMonth(){
  const[y,m]=S.ms.split('-').map(Number);
  const first=`${S.ms}-01`,last=iso(new Date(y,m,0));
  let d=mondayOf(first);const cells=[];
  while(d<=last||(d8(d).getDay()!==1)){cells.push(d);d=addDays(d,1);if(cells.length>42)break}
  let h=`<div class="mwrap"><div class="mhead">${['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<span>${x}</span>`).join('')}</div><div class="month">`;
  cells.forEach(f=>{const ts=S.trabajos.filter(t=>covers(t,f)).sort((a,b)=>a.rec.localeCompare(b.rec));const o=occDay(f);const out=f.slice(0,7)!==S.ms;
    h+=`<div class="mday${out?' out':''}${f===TODAY?' today':''}"><div class="mt"><span class="dn">${d8(f).getDate()}</span>${ts.length?`<span class="opct" style="--c:${occC(o)}" title="Recursos ocupados">${o}%</span>`:''}</div>
      ${ts.slice(0,4).map(t=>`<button class="mchip s-${dayState(t,f)}" data-a="t-open" data-id="${t.id}" title="${t.id} · ${recOf(t.rec).n} · ${esc(t.pozo)}">${t.rec} · ${CONTRATOS[t.ct].op} ${esc(t.pozo)}</button>`).join('')}
      ${ts.length>4?`<span class="more">+${ts.length-4} más</span>`:''}
      ${f>=TODAY&&!out?`<button class="add" data-a="p-cell" data-d="${f}" aria-label="Planificar el ${fDay(f)}">+</button>`:''}</div>`});
  return h+'</div></div>';
}

}

function vDay(){
  const R=USERS.operador.rec;
  const obs=S.partes.filter(p=>p.rec===R&&p.estado==='obs');
  const hoy=S.trabajos.filter(t=>t.rec===R&&covers(t,TODAY)).map(t=>({t,p:parteOf(t.id,TODAY)})).filter(x=>!x.p||x.p.estado==='curso'||x.p.estado==='plan');
  const prox=S.trabajos.filter(t=>t.rec===R&&t.inicio>TODAY).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const env=S.partes.filter(p=>p.rec===R&&['env','apr','cert'].includes(p.estado)).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,4);
  const meta=(x)=>`<div class="meta"><span>${ic('pin')}${esc(x.yac)} · ${esc(x.pozo)}</span><span>${ic('clock')}${shiftTxt(x)}</span><span>${OPS[CONTRATOS[x.ct].op]} · <span class="mono">${x.ct}</span></span></div>`;
  let h=`<div class="hello"><div><h2>Buen día, Diego</h2><p>Cuadrilla 03 · ${CREW[R].length} personas · ${VEH[R].join(' y ')}</p></div></div>`;
  if(obs.length)h+=`<section class="sect"><h3 style="color:var(--st-obs)">${ic('alert')}Para corregir</h3><div class="cards">${obs.map(p=>`<div class="tcard obs"><div><div class="t1"><span class="mono">${p.id}</span>${pill(p.estado)}<span class="sm">${fDay(p.fecha)}</span></div><h4>${p.prev.map(esc).join(' · ')}</h4>${meta(p)}</div><div><button class="btn pri lg" data-a="o-open" data-id="${p.id}">Corregir parte</button></div>${p.dec?`<div class="vnote">${ic('back')}<div><b>Observado por ${esc(p.dec.who)} · ${esc(p.dec.t)}</b>${esc(p.dec.com)}</div></div>`:''}</div>`).join('')}</div></section>`;
  h+=`<section class="sect"><h3>Hoy · lunes 5 de octubre</h3><div class="cards">${hoy.map(({t,p})=>{const i=diffD(t.inicio,TODAY);
    const act=p?`<button class="btn pri lg" data-a="o-open" data-id="${p.id}">Continuar ${ic('right')}</button>`:`<button class="btn pri lg" data-a="o-start" data-pl="${t.id}">Iniciar parte</button>`;
    return `<div class="tcard${p?' cur':''}"><div><div class="t1">${p?`<span class="mono">${p.id}</span>`:''}${pill(p?p.estado:'plan')}${prioB(t.prio)}<span class="tag">${t.id} · día ${i+1} de ${t.dias}</span></div><h4>${t.prev.map(esc).join(' · ')}</h4>${meta(t)}</div><div>${act}</div>${p?`<div class="prog" aria-label="Avance del parte">${STEPS.map((s,k)=>`<i class="${stepOk(p,k)?'on':''}" title="${s}"></i>`).join('')}</div>`:''}${t.ind?`<div class="vnote" style="background:var(--panel-2)">${ic('pin')}<div style="color:var(--ink)">${esc(t.ind)}</div></div>`:''}</div>`}).join('')||'<div class="empty">No tenés trabajo planificado para hoy.</div>'}</div></section>`;
  h+=`<section class="sect"><h3>Próximos trabajos</h3><div class="cards two">${prox.map(t=>`<div class="tcard mini"><div><div class="t1"><span class="mono">${t.id}</span>${prioB(t.prio)}<span class="sm">${fDay(t.inicio)} → ${fDay(tEnd(t))} · ${t.dias} días</span></div><h4>${t.prev.map(esc).join(' · ')}</h4>${meta(t)}</div></div>`).join('')||'<div class="empty">Sin planificación cargada.</div>'}</div></section>`;
  h+=`<section class="sect"><h3>Enviados</h3><div class="cards two">${env.map(p=>`<div class="tcard mini"><div><div class="t1"><span class="mono">${p.id}</span>${pill(p.estado)}${p.cola?`<span class="flag warn">${ic('nowifi')}En cola</span>`:''}<span class="sm">${fDay(p.fecha)}</span></div><h4>${esc(p.yac)} · ${esc(p.pozo)}</h4></div><div><button class="btn sm2" data-a="sum" data-id="${p.id}">${ic('doc')}Resumen</button></div></div>`).join('')||'<div class="empty">Todavía no enviaste partes.</div>'}</div></section>`;
  return h;
}

function tbar(p){

    return `<div class="tseg c-${t.c}" style="left:${o/W*100}%;width:${ww/W*100}%" title="${TCAT[t.c]} ${t.de}–${t.a}">${ww>=50?TCAT[t.c]:''}</div>`}).join('');
  const ticks=[0,2,4,6,8,10,12].map(h=>`<span style="left:${h/12*100}%">${addM(st,h*60)}</span>`).join('');

  <div class="tlegend">${Object.keys(TCAT).map(c=>`<span class="c-${c}"><i></i>${TCAT[c]} <b>${s.byc[c]?fmtH(s.byc[c]):'—'}</b></span>`).join('')}</div>`;

function vInbox(role){
  const isV=role==='v';
  const fk=isV?'vf':'cf',sk=isV?'vsel':'csel',f=S[fk];
  const base=isV?S.partes.filter(p=>!p.cola):S.partes.filter(p=>p.op===USERS.cliente.op);
  const tabs=isV?[['env','Pendientes',p=>p.estado==='env'],['obs','Observados',p=>p.estado==='obs'],['apr','Aprobados',p=>p.estado==='apr'||p.estado==='cert']]
    :[['apr','Para certificar',p=>p.estado==='apr'],['cert','Certificados',p=>p.estado==='cert'],['obs','Observados',p=>p.estado==='obs']];
  const tf=tabs.find(x=>x[0]===f)||tabs[0];
  const list=base.filter(tf[2]).sort((a,b)=>f===tabs[0][0]?a.fecha.localeCompare(b.fecha):b.fecha.localeCompare(a.fecha));
  if(!list.find(p=>p.id===S[sk]))S[sk]=list[0]?list[0].id:null;
  const rows=list.map(p=>{const c=checks(p),ne=c.filter(x=>x[0]==='err').length,nw=c.filter(x=>x[0]==='warn').length;
    return `<button class="vrow" data-a="${role}-sel" data-id="${p.id}"${p.id===S[sk]?' aria-current="true"':''}><div class="r1"><b>${recOf(p.rec).n}</b><span class="mono sm">${p.id}</span></div><div class="r2">${fDay(p.fecha)} · ${isV?OPS[p.op]+' · ':''}${esc(p.yac)} ${esc(p.pozo)}</div><div class="r2"><span class="mono">${p.ct}</span> · CC ${p.cc}</div><div class="r3">${ne?`<span class="flag err">${ic('err')}${ne} bloqueante${ne>1?'s':''}</span>`:''}${nw?`<span class="flag warn">${ic('alert')}${nw} alerta${nw>1?'s':''}</span>`:''}${!ne&&!nw?`<span class="flag ok">${ic('check')}Sin alertas</span>`:''}</div></button>`}).join('');
  let sumBox='';
  if(!isV){const byCt={};base.forEach(p=>{byCt[p.ct]=byCt[p.ct]||{a:0,c:0};if(p.estado==='apr')byCt[p.ct].a++;if(p.estado==='cert')byCt[p.ct].c++});
    sumBox=`<div class="vsum">${Object.entries(byCt).map(([k,v])=>`<div><span class="mono">${k}</span><span>${v.a} por certificar · <b>${v.c}</b> certificados</span></div>`).join('')}</div>`}
  return `<div class="vin"><div class="vlist" data-keep="vl"><div class="seg">${tabs.map(([k,l,fn])=>`<button data-a="${role}-filter" data-f="${k}" aria-pressed="${tf[0]===k}">${l} ${base.filter(fn).length}</button>`).join('')}</div>${sumBox}${rows||`<div class="empty" style="margin:12px">No hay partes en este estado.</div>`}</div>
  <div class="vdet">${S[sk]?detail(byId(S[sk]),role):`<div class="vscroll"><div class="empty">Elegí un parte de la lista.</div></div>`}</div></div>`;
}

function buildPdf(p){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=14,e=p.ejec,t=trab(p.pl),c=CONTRATOS[p.ct],s=sums(p);
  const cl=x=>String(x??'').replace(/[–—]/g,'-').replace(/→/g,'->');
  let y=0;
  doc.setFillColor(194,31,53);doc.rect(0,0,W,24,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('VIENTOS DEL SUR',M,11);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text('Parte diario de servicio - resumen',M,18);
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(p.id,W-M,11,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(cl(`${fDayL(p.fecha)} · ${EST[p.estado]}`),W-M,18,{align:'right'});
  y=32;
  const sec=tt=>{if(y>262){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(194,31,53);doc.text(cl(tt).toUpperCase(),M,y);doc.setDrawColor(220,225,231);doc.line(M,y+1.6,W-M,y+1.6);doc.setTextColor(20,32,42);y+=4};
  const base={margin:{left:M,right:M},styles:{font:'helvetica',fontSize:8.6,cellPadding:1.8,textColor:[20,32,42],lineColor:[220,225,231],lineWidth:.2},headStyles:{fillColor:[19,33,44],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[247,249,251]},theme:'grid'};
  const tbl=(head,body,o)=>{doc.autoTable(Object.assign({},base,{startY:y,head:head?[head.map(cl)]:undefined,body:body.map(r=>r.map(cl))},o||{}));y=doc.lastAutoTable.finalY+7};
  const kv=rows=>tbl(null,rows,{theme:'plain',styles:Object.assign({},base.styles,{lineWidth:0}),columnStyles:{0:{fontStyle:'bold',textColor:[92,105,118],cellWidth:38},2:{fontStyle:'bold',textColor:[92,105,118],cellWidth:38}}});
  sec('Datos del servicio');
  kv([['Contrato',`${p.ct} · ${c.n}`,'Centro de costo',`${p.cc} · ${c.ccn}`],['Operadora',OPS[p.op],'Locación',`${p.yac} · ${p.pozo}`],['Recurso',`${recOf(p.rec).n} · ${jefeOf(p.rec)}`,'Turno',shiftTxt(p)],['Trabajo',`${p.pl} · día ${p.dia+1} de ${t?t.dias:'-'}`,'Prioridad',PRIO[p.prio]],['Supervisor responsable',p.sup||'-','Responsable técnico',p.rt||'-'],['Llegada a locación',e.llegada||'-','Estado',EST[p.estado]]]);
  sec('Condiciones climáticas y seguridad');
  const w=e.clima;
  kv([['Temperatura',w&&w.t!==''?w.t+' °C':'-','Viento / ráfagas',w?`${w.v||'-'} / ${w.r||'-'} km/h ${w.dir}`:'-'],['Condición',w?w.cond:'-','Fuente',w?(w.src==='app'?'App de clima de la tablet '+(w.at||''):'Carga manual'):'-'],['Charla de seguridad',e.check.charla?'Sí':'No','Permiso de trabajo',e.check.ptw?'Vigente':'No'],['EPP verificado',e.check.epp?'Sí':'No','','']]);
  sec(`Personal · ${s.pers} presentes · ${fmtH(s.hh)} hombre`);
  tbl(['Persona','Rol','Ingreso','Salida','Horas','Habilitación'],e.personal.map(x=>[x.n,x.rol,x.pres?x.in||'-':'Ausente',x.pres?x.out||'-':'',x.pres&&x.in&&x.out?fmtH(dur(x.in,x.out)):'-',habTxt(hab(x.n,p.op,p.fecha))]));
  sec(`Equipos · ${num(s.km)} km`);
  tbl(['Equipo','Km inicial','Km final','Recorrido','Habilitación'],e.equipos.map(q=>[`${q.c} ${EQ[q.c]}`,q.k0===''?'-':num(q.k0),q.k1===''?'-':num(q.k1),q.k0!==''&&q.k1!==''?num(q.k1-q.k0)+' km':'-',habTxt(hab(q.c,p.op,p.fecha))]));
  sec('Actividades realizadas');
  tbl(['Tarea','Cantidad','Unidad','Origen','Detalle'],e.tareas.length?e.tareas.map(x=>[x.d,Number(x.q)>0?num(x.q):'-',x.u,p.prev.includes(x.d)?'Prevista':'Adicional',x.det||'-']):[['Sin tareas informadas','','','','']]);
  sec(`Tiempos del turno · ${fmtH(s.jor)}`);
  tbl(['Categoría','Desde','Hasta','Duración'],e.tiempos.map(x=>[TCAT[x.c],x.de,x.a,fmtH(dur(x.de,x.a))]));
  sec('Observaciones');
  doc.setFont('helvetica','normal');doc.setFontSize(9);const lines=doc.splitTextToSize(cl(e.obs||'Sin observaciones.'),W-2*M);doc.text(lines,M,y+2);y+=lines.length*4.2+8;
  const ck=checks(p);
  if(ck.length){sec('Controles automáticos');tbl(['Nivel','Detalle'],ck.map(x=>[x[0]==='err'?'Bloqueante':'Alerta',x[1]]),{columnStyles:{0:{cellWidth:28}}})}
  if(y>230){doc.addPage();y=18}
  sec('Firmas y aprobaciones');
  const bw=(W-2*M-8)/3,by=y+2;
  [[jefeOf(p.rec),'Jefe de cuadrilla',''],[p.dec&&p.dec.d==='ok'?p.dec.who:'Pendiente','Revisión VDS',p.dec&&p.dec.d==='ok'?p.dec.t:''],[p.cert?p.cert.who:'Pendiente','Certificación '+OPS[p.op],p.cert?p.cert.t:'']].forEach((b,i)=>{
    const x=M+i*(bw+4);doc.setDrawColor(200,207,216);doc.roundedRect(x,by,bw,30,2,2);
    if(i===0&&e.firma){if(e.firma==='seed'){doc.setDrawColor(20,32,42);doc.setLineWidth(.5);const sx=bw*.8/300,sy=14/90;let px=x+4+SEEDSIG[0][0]*sx,py=by+2+SEEDSIG[0][1]*sy;SEEDSIG.slice(1).forEach(q=>{const nx=x+4+q[4]*sx,ny=by+2+q[5]*sy;doc.line(px,py,nx,ny);px=nx;py=ny});doc.setLineWidth(.2)}
      else{try{doc.addImage(e.firma,'PNG',x+3,by+2,bw-6,16)}catch(er){}}}
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,32,42);doc.text(cl(b[0]),x+3,by+23);
    doc.setFont('helvetica','normal');doc.setFontSize(7.8);doc.setTextColor(92,105,118);doc.text(cl(b[1]+(b[2]?' · '+b[2]:'')),x+3,by+27.5);});
  y=by+38;doc.setTextColor(20,32,42);
  sec('Historial');
  tbl(['Fecha','Persona','Acción','Comentario'],p.hist.map(x=>[x.t,x.who,x.a,x.c||'']),{columnStyles:{0:{cellWidth:26},1:{cellWidth:42},2:{cellWidth:44}}});
  const ph=e.fotos.filter(f=>f.src);
  if(ph.length){doc.addPage();y=18;sec('Registro fotográfico');y+=2;ph.forEach((f,i)=>{const col=i%2,row=Math.floor(i/2)%3;if(i&&i%6===0){doc.addPage();y=20}const x=M+col*93,yy=y+row*76;try{doc.addImage(f.src,'JPEG',x,yy,88,64)}catch(er){}doc.setFontSize(8);doc.setTextColor(92,105,118);doc.text(cl(f.cap),x,yy+69)})}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(137,148,160);doc.text(cl(`VDS Partes de campo · ${p.id} · generado el ${fDay(TODAY)} 2026 ${hm()}`),M,290);doc.text(`Página ${i} de ${n}`,W-M,290,{align:'right'})}
  return doc.output('blob');
}
async function downloadPdf(id){
  const p=byId(id);if(!p||!p.ejec){toast('Este parte todavía no tiene datos para exportar');render();return}
  if(!window.jspdf||!window.jspdf.jsPDF){toast('No se pudo cargar el generador de PDF');render();return}
  let blob;try{blob=buildPdf(p)}catch(e){toast('No se pudo armar el PDF');render();return}
  const filename=`${p.id}_${p.fecha}_${p.pozo.replace(/[^A-Za-z0-9-]+/g,'-')}.pdf`;
  const inClaude=!!(window.claude&&window.claude.use);
  if(!inClaude){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(`PDF de ${p.id} descargado`);render();return}
  let dl=null;try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(!dl){toast('La descarga no está disponible en esta vista');render();return}
  try{await dl.save({filename,data:blob});toast(`PDF de ${p.id} descargado`)}
  catch(e){if(e&&e.code==='declined')return;toast('No se pudo descargar el PDF')}
  render();
}

/* ---------- firma ---------- */
function initSig(){
  const cv=$('#sig');if(!cv)return;
  const p=cur(),e=p.ejec,ctx=cv.getContext('2d');
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#14202A';
  ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;
  if(e.firma==='seed'){ctx.beginPath();const sx=cv.width/300,sy=cv.height/90;ctx.moveTo(SEEDSIG[0][0]*sx,SEEDSIG[0][1]*sy);SEEDSIG.slice(1).forEach(q=>ctx.bezierCurveTo(q[0]*sx,q[1]*sy,q[2]*sx,q[3]*sy,q[4]*sx,q[5]*sy));ctx.stroke()}
  else if(e.firma){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=e.firma}
  let down=false,last=null;
  const pt=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',ev=>{down=true;last=pt(ev);cv.setPointerCapture(ev.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],2.5,0,7);ctx.fillStyle=ink;ctx.fill()});
  cv.addEventListener('pointermove',ev=>{if(!down)return;const q=pt(ev);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();last=q});
  const up=()=>{if(!down)return;down=false;e.firma=cv.toDataURL('image/png');render()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

function setBind(path,val){
  const i=path.indexOf(':'),root=path.slice(0,i),keys=path.slice(i+1).split('.');
  let o=root==='m'?UI.modal.f:root==='e'?cur().ejec:root==='p'?cur():root==='l'?UI.login:root==='v'?UI:null;
  if(!o)return;
  if(root==='e'&&keys[0]==='clima'){if(!o.clima)o.clima={t:'',v:'',r:'',dir:'O',cond:'Despejado',src:'manual'};o.clima.src='manual'}
  for(let k=0;k<keys.length-1;k++)o=o[keys[k]];
  o[keys[keys.length-1]]=val;
  if(root==='v')UI.verr='';
  if(root==='m'&&keys[0]==='ct'){const c=CONTRATOS[val];const f=UI.modal.f;f.rec=c.recs.includes(f.rec)?f.rec:c.recs[0];f.yac=c.yacs[0];f.prev=[]}
}
function moveT(t,inicio,dias,why){
  const a={i:t.inicio,d:t.dias};t.inicio=inicio;t.dias=dias;
  const txt=a.d!==dias&&a.i===inicio?`Duración: ${a.d} → ${dias} días (hasta ${fDay(tEnd(t))})`:a.i!==inicio&&a.d===dias?`Reprogramado: ${fDay(a.i)} → ${fDay(inicio)}`:`Reprogramado: ${fDay(inicio)} → ${fDay(tEnd(t))} · ${dias} días`;
  t.hist.push({t:nowT(),who:USERS.planner.n,a:txt,c:why||''});
  const cl=clashes(t);toast(`${t.id} · ${txt}${cl.length?' · se superpone con '+cl.map(x=>x.id).join(', '):''}`);
}

function submitNew(){
  const M=UI.modal,f=M.f;M.err={};
  if(!f.pozo.trim())M.err.pozo='Indicá el pozo o la locación.';
  if(!f.prev.length)M.err.prev='Elegí al menos una tarea prevista.';
  if(M.err.pozo||M.err.prev){render();return}
  const n=Math.max(...S.trabajos.map(t=>Number(t.id.slice(3))))+1;
  const id='PL-'+String(n).padStart(3,'0');
  const t={id,ct:f.ct,rec:f.rec,yac:f.yac,pozo:f.pozo.trim(),inicio:f.inicio,dias:f.dias,turno:f.turno,prio:f.prio,prev:f.prev.slice(),ind:f.ind.trim(),sup:f.sup,rt:f.rt,hist:[{t:nowT(),who:USERS.planner.n,a:'Planificado',c:''}]};
  S.trabajos.push(t);UI.modal=null;
  const cl=clashes(t);toast(`${id} planificado · ${recOf(f.rec).n}, ${fDay(f.inicio)} → ${fDay(tEnd(t))}${cl.length?' · se superpone con '+cl.map(x=>x.id).join(', '):''}`);render();
}
function onFiles(inp){
  const e=cur().ejec;const files=[...inp.files].slice(0,8);let pending=files.length;
  files.forEach(file=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    e.fotos.push({src:c.toDataURL('image/jpeg',.75),cap:file.name.replace(/\.[^.]+$/,'')});if(--pending===0)render()};im.onerror=()=>{if(--pending===0)render()};im.src=r.result};r.readAsDataURL(file)});
}

});
scr.addEventListener('input',ev=>{const b=ev.target.dataset&&ev.target.dataset.bind;if(b){setBind(b,ev.target.value);save()}});
scr.addEventListener('change',ev=>{
  if(ev.target.type==='file'){onFiles(ev.target);return}
  const b=ev.target.dataset&&ev.target.dataset.bind;if(!b)return;
  setBind(b,ev.target.value);
  if('rr' in ev.target.dataset)render();else save();
});
scr.addEventListener('submit',ev=>{ev.preventDefault();
  if(ev.target.id==='loginf'){const L=UI.login;const r=Object.keys(USERS).find(k=>USERS[k].id===L.u.trim().toLowerCase());
    if(!r||L.p!==PW){L.err='Usuario o contraseña incorrectos. Probá con un usuario de prueba.';render();return}
    S.user=r;S.route=HOME[r];UI.login={u:'',p:'',err:''};render()}
  if(ev.target.id==='newf')submitNew();
});
/* Gantt: arrastrar para mover, borde para estirar o acortar */
scr.addEventListener('pointerdown',ev=>{
  const bar=ev.target.closest('.gbar');if(!bar)return;
  const t=trab(bar.dataset.id),track=bar.parentElement;
  const h=ev.target.dataset&&ev.target.dataset.h;
  drag={bar,t,mode:h==='r'?'r':h==='l'?'l':'m',x0:ev.clientX,px:track.getBoundingClientRect().width/28,o:{i:t.inicio,d:t.dias},n:{i:t.inicio,d:t.dias},moved:false,lock:started(t),min:minDias(t)};
  bar.setPointerCapture(ev.pointerId);ev.preventDefault();
});
scr.addEventListener('pointermove',ev=>{
  if(!drag)return;const dx=ev.clientX-drag.x0;if(Math.abs(dx)>5)drag.moved=true;if(!drag.moved)return;
  const dd=Math.round(dx/drag.px),o=drag.o;let i=o.i,d=o.d;
  if(drag.mode==='r')d=Math.max(drag.min,Math.min(30,o.d+dd));
  else if(drag.lock)return;
  else if(drag.mode==='l'){const k=Math.min(dd,o.d-1);i=addDays(o.i,k);d=o.d-k;if(i<TODAY){d-=diffD(i,TODAY);i=TODAY}}
  else{i=addDays(o.i,dd);if(i<TODAY)i=TODAY}
  drag.n={i,d};drag.bar.classList.add('drag');
  drag.bar.style.left=(diffD(S.gs,i)/28*100)+'%';drag.bar.style.width=(d/28*100)+'%';
  const gl=drag.bar.querySelector('.gl');if(gl)gl.innerHTML=`<span class="mono">${drag.t.id}</span> ${d} días · ${fDay(i)} → ${fDay(addDays(i,d-1))}`;
});
const endDrag=()=>{
  if(!drag)return;const g=drag;drag=null;
  if(!g.moved){UI.drawer=g.t.id;render();return}
  if(g.lock&&g.mode!=='r'){toast(`${g.t.id} ya tiene partes cargados: solo se puede estirar o acortar desde el final`);render();return}
  if(g.n.i!==g.o.i||g.n.d!==g.o.d)moveT(g.t,g.n.i,g.n.d);
  render();
};
scr.addEventListener('pointerup',endDrag);scr.addEventListener('pointercancel',endDrag);

/* ---------- prototype chrome ---------- */
function chrome(){document.querySelectorAll('#jump button').forEach(b=>b.setAttribute('aria-pressed',String((S.user||'login')===b.dataset.j)))}
$('#jump').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const j=b.dataset.j;UI.modal=null;UI.drawer=null;
  if(j==='login'){S.user=null;S.route='login'}else{S.user=j;S.route=HOME[j]}render()});
$('#hotbtn').addEventListener('click',ev=>{UI.hot=!UI.hot;ev.currentTarget.setAttribute('aria-pressed',String(UI.hot));scr.classList.toggle('hs-on',UI.hot)});
const rb=$('#resetbtn');let rbT=null;
rb.addEventListener('click',()=>{
  if(!UI.resetArm){UI.resetArm=true;rb.textContent='Confirmar reinicio';rb.classList.add('warn');clearTimeout(rbT);rbT=setTimeout(()=>{UI.resetArm=false;rb.textContent='Reiniciar demo';rb.classList.remove('warn')},3500);return}
  UI.resetArm=false;rb.textContent='Reiniciar demo';rb.classList.remove('warn');
  S=fresh();UI.modal=null;UI.drawer=null;UI.vcom='';toast('Demo reiniciada con los datos de ejemplo');render();
});
function fit(){
  const st=$('#stage'),w=st.clientWidth;
  const top=st.getBoundingClientRect().top;
  const sW=w/DW,sH=(window.innerHeight-Math.max(top,0)-48)/DH;
  const s=Math.min(1,sW,Math.max(sH,0.6));
  $('#device').style.setProperty('--s',s.toFixed(4));
  st.style.height=Math.ceil(DH*s)+'px';
}
window.addEventListener('resize',fit);
fit();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
